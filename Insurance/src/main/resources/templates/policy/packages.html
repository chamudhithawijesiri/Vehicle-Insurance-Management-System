<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Insurance Package - Auto Shield</title>
    <!-- FontAwesome for beautiful modern icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <style>
        /* Import modern typography */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

        /* Design System Variables */
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --primary-color: #00f2fe;
            --secondary-color: #4facfe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --error-color: #ef4444;
            --success-color: #10b981;
            --glow-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
            --glass-blur: blur(16px);
        }

        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top, rgba(11, 15, 25, 0.8) 0%, #0b0f19 100%);
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background animated elements */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Navigation Bar */
        header {
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--card-border);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            text-decoration: none;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .nav-links a.active {
            color: var(--text-primary);
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.6rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #0b0f19;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-shadow);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--card-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        /* Landing Page Hero Section */
        .hero {
            min-height: 100vh;
            padding-top: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 4rem;
            align-items: center;
        }

        .hero-content h1 {
            font-size: 3.8rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 1.5rem;
        }

        .hero-content h1 span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-content p {
            font-size: 1.15rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 2.5rem;
            max-width: 600px;
        }

        .hero-actions {
            display: flex;
            gap: 1rem;
        }

        /* Hero Badge/Graphic Mockup */
        .hero-graphic {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shield-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: var(--glass-blur);
            padding: 2.5rem;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            max-width: 380px;
            animation: float 6s ease-in-out infinite;
        }

        .shield-icon {
            font-size: 4.5rem;
            margin-bottom: 1.5rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .shield-card h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .shield-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Features Section */
        .features {
            padding: 6rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-header h2 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .section-header h2 span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .feature-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: var(--glass-blur);
            padding: 2.5rem;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 242, 254, 0.3);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.05);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .feature-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .feature-card p {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        /* Forms Section (Login & Registration) */
        .form-section {
            min-height: 100vh;
            padding-top: 100px;
            padding-bottom: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-container {
            width: 100%;
            max-width: 520px;
            margin: 0 1.5rem;
        }

        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: var(--glass-blur);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .form-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .form-header h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .form-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-header p a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .form-header p a:hover {
            text-decoration: underline;
        }

        /* Alert Boxes */
        .alert {
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-left: 4px solid transparent;
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border-left-color: var(--error-color);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border-left-color: var(--success-color);
        }

        /* Input Fields styling */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .input-control {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .input-control:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.15);
        }

        /* Specific structure for 2-column input row */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* Dashboard Styling */
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 2rem 60px;
        }

        .welcome-banner {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.1) 0%, rgba(79, 172, 254, 0.1) 100%);
            border: 1px solid rgba(0, 242, 254, 0.2);
            backdrop-filter: var(--glass-blur);
            padding: 3rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .welcome-text h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .welcome-text p {
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 2rem;
        }

        .dashboard-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: var(--glass-blur);
            border-radius: 16px;
            padding: 2.5rem;
        }

        .dashboard-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .profile-details, .policy-details {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding-bottom: 0.75rem;
        }

        .detail-row:last-child {
            border: none;
            padding: 0;
        }

        .detail-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .detail-value {
            font-weight: 600;
            color: var(--text-primary);
        }

        .policy-badge {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--card-border);
            padding: 3rem 2rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            background: rgba(7, 10, 18, 0.6);
        }

        /* Responsive adjustments */
        @media (max-width: 968px) {
            .hero-container {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 3rem;
            }

            .hero-content h1 {
                font-size: 2.8rem;
            }

            .hero-actions {
                justify-content: center;
            }

            .hero-graphic {
                display: none;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 576px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .form-card {
                padding: 2rem 1.5rem;
            }

            .welcome-banner {
                flex-direction: column;
                text-align: center;
                gap: 1.5rem;
            }
        }

        /* Admin Dashboard Table Styles */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
            text-align: left;
        }

        .admin-table th {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
            padding: 1rem;
            font-weight: 600;
            border-bottom: 2px solid var(--card-border);
            font-size: 0.95rem;
        }

        .admin-table td {
            padding: 1rem;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.9rem;
            vertical-align: middle;
        }

        .admin-table tr:hover td {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.01);
        }

        /* Badges for roles */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-admin {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .badge-user {
            background: rgba(0, 242, 254, 0.15);
            color: var(--primary-color);
            border: 1px solid rgba(0, 242, 254, 0.3);
        }

        /* Delete Button */
        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 0.45rem 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-delete:hover {
            background: var(--error-color);
            color: #0b0f19;
            transform: translateY(-1px);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
        }

        /* ==========================================
           CUSTOMER DASHBOARD DESIGN UPGRADES
           ========================================== */

        /* Dashboard layout grid structure */
        .dashboard-layout {
            display: flex;
            min-height: 100vh;
            padding-top: 80px; /* space below navigation */
        }

        /* Sidebar navigation */
        .sidebar {
            width: 280px;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--card-border);
            position: fixed;
            top: 80px;
            bottom: 0;
            left: 0;
            padding: 2.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 90;
        }

        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .sidebar-item a {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 1.25rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            border-radius: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .sidebar-item a:hover {
            color: var(--primary-color);
            background: rgba(255, 255, 255, 0.02);
        }

        .sidebar-item a i {
            font-size: 1.15rem;
            width: 20px;
            text-align: center;
        }

        .sidebar-item.active a {
            color: #0b0f19;
            background: var(--accent-gradient);
            font-weight: 600;
            box-shadow: var(--glow-shadow);
        }

        /* Dashboard main content area */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 2.5rem 3.5rem 6rem;
            min-height: 100%;
        }

        /* Summary metrics widgets */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: var(--glass-blur);
            padding: 1.5rem;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 1.25rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .metric-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 242, 254, 0.25);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
        }

        .metric-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: rgba(0, 242, 254, 0.08);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }

        .metric-info h3 {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.75px;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-top: 0.2rem;
        }

        /* Tab display toggling */
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        /* Responsive recent logs & table view */
        .recent-table-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: var(--glass-blur);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .recent-table-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.75rem;
        }

        /* Badge status indicators */
        .badge-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
        }

        .badge-pending {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .badge-approved {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-paid {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-rejected {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Notifications list */
        .notification-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            transition: all 0.3s ease;
        }

        .notification-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(0, 242, 254, 0.1);
            transform: translateX(3px);
        }

        .notification-icon {
            font-size: 1.25rem;
            color: var(--primary-color);
            margin-top: 0.1rem;
        }

        .notification-icon.warning {
            color: #fbbf24;
        }

        .notification-details h4 {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .notification-details p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 0.4rem;
        }

        .notification-time {
            font-size: 0.75rem;
            color: rgba(156, 163, 175, 0.6);
            display: block;
        }

        /* Modals overlays & animations */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(7, 10, 18, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1.5rem;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 550px;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            animation: zoomIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-close {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: var(--primary-color);
        }

        .modal-header {
            margin-bottom: 2rem;
        }

        .modal-header h2 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .modal-header h2 span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Grid for general details info */
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .action-row {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        /* Profile inputs styling */
        .profile-input-control {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .profile-input-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.15);
        }

        .profile-input-control:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* Animations */
        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Dashboard Rules */
        @media (max-width: 1024px) {
            .sidebar {
                width: 80px;
                padding: 2.5rem 0.5rem;
                align-items: center;
            }

            .sidebar-item a span {
                display: none;
            }

            .sidebar-item a {
                justify-content: center;
                padding: 0.9rem;
            }

            .main-content {
                margin-left: 80px;
                padding: 2.5rem 2rem 6rem;
            }
        }

        @media (max-width: 768px) {
            .dashboard-layout {
                flex-direction: column;
                padding-top: 70px;
            }

            .sidebar {
                position: static;
                width: 100%;
                height: auto;
                flex-direction: row;
                overflow-x: auto;
                padding: 0.5rem 1rem;
                border-right: none;
                border-bottom: 1px solid var(--card-border);
                top: auto;
            }

            .sidebar-menu {
                flex-direction: row;
                width: 100%;
                justify-content: flex-start;
                gap: 0.25rem;
            }

            .sidebar-item a {
                padding: 0.75rem 1rem;
            }

            .main-content {
                margin-left: 0;
                padding: 1.5rem 1rem 5rem;
            }

            .grid-2col {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }



    </style>

    <style>
        /* Styling for packages page */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 2.5rem;
            margin-bottom: 2.5rem;
        }

        .package-card {
            background: rgba(17, 24, 39, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            backdrop-filter: var(--glass-blur);
        }

        .package-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 242, 254, 0.4);
            box-shadow: 0 8px 24px rgba(0, 242, 254, 0.08);
            background: rgba(17, 24, 39, 0.7);
        }

        .package-card.selected {
            border-color: var(--primary-color);
            box-shadow: var(--glow-shadow);
            background: rgba(11, 23, 47, 0.7);
        }

        .package-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .card-inner {
            padding: 2.5rem 1.8rem;
            display: flex;
            flex-direction: column;
            height: 100%;
            align-items: center;
            text-align: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .package-card.selected .card-inner {
            padding: 2.2rem 1.8rem;
        }

        .package-card h3 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
            transition: color 0.3s ease;
        }

        .package-card.selected h3 {
            color: var(--primary-color);
        }

        /* Detail container reveal animation */
        .pkg-details {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            text-align: left;
            border-top: 1px solid rgba(255, 255, 255, 0);
            margin-top: 0;
            padding-top: 0;
        }

        .package-card.selected .pkg-details {
            max-height: 300px;
            opacity: 1;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .features-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .features-list li {
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .features-list li i {
            color: var(--success-color);
            font-size: 0.9rem;
        }
    </style>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>

<!-- Header Navigation -->
<header>
    <div class="nav-container">
        <a href="/" class="logo">
            <i class="fa-solid fa-shield-halved"></i> Auto<span>Shield</span>
        </a>
        <ul class="nav-links">
            <li><a href="/dashboard">Dashboard</a></li>
            <li>
                <form id="logoutForm" th:action="@{/logout}" method="POST" style="display: none;"></form>
                <a href="javascript:void(0);" onclick="document.getElementById('logoutForm').submit();" class="btn btn-secondary">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>
            </li>
        </ul>
    </div>
</header>

<main class="container" style="max-width: 1200px; margin: 8rem auto 4rem auto; padding: 0 2rem;">
    <div class="section-header" style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem;">Select an <span>Insurance Package</span></h1>
        <p style="color: var(--text-secondary); max-width: 600px; margin: 0 auto;">Choose or renew coverage from our 4 tailored schemes built for your vehicle safety and compliance.</p>
    </div>

    <form th:action="@{/packages/select}" method="post" id="packageForm" onsubmit="event.preventDefault();">
        <div class="packages-grid">

            <div th:each="plan, iter : ${packagesList}"
                 class="package-card" th:classappend="${plan.featured} ? 'featured' : ''"
                 th:onclick="'selectCard(this, \'pkg-' + ${plan.id} + '\')'">
                <input type="radio" th:id="'pkg-' + ${plan.id}" name="selectedPlan" th:value="${plan.planName}"
                       th:checked="${plan.featured}" required>
                <div class="card-inner">
                    <h3 th:text="${plan.planName}">Motor Comprehensive</h3>
                    <div class="pkg-details">
                        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Includes:</p>
                        <ul class="features-list">
                            <li th:each="feature : ${#strings.arraySplit(plan.coverage, ',')}">
                                <i class="fa-solid fa-circle-check"></i> <span th:text="${#strings.trim(feature)}">Feature</span>
                            </li>
                        </ul>
                        <p style="margin-top: 1rem; font-weight: 700; color: var(--primary-color);"
                           th:text="${'Rs. ' + #numbers.formatDecimal(plan.basePrice, 1, 'COMMA', 2, 'POINT') + ' onwards'}">Rs. 85,000.00 onwards</p>
                        <div style="margin-top: 1.5rem; display: flex; justify-content: center;">
                            <button type="button" class="btn btn-primary select-package-btn" th:data-plan="${plan.planName}"
                                    style="padding: 0.6rem 1.4rem; font-size: 0.85rem; width: 100%;">
                                Select Package <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div style="margin-top: 2.5rem; display: flex; justify-content: center; align-items: center;">
            <a href="/dashboard" class="btn btn-secondary" style="padding: 0.9rem 2.2rem;">
                <i class="fa-solid fa-arrow-left"></i> Return to Dashboard
            </a>
        </div>
    </form>
</main>

<!-- Footer -->
<footer style="text-align: center; margin-top: 5rem; padding: 2rem 0; border-top: 1px solid var(--card-border);">
    <p>&copy; 2026 Auto Shield. All rights reserved.</p>
</footer>

<!-- Interactive script for card selection & redirects -->
<script>
    function selectCard(cardElement, radioId) {
        // Uncheck all radios and remove selected class from all cards
        document.querySelectorAll('.package-card').forEach(card => {
            card.classList.remove('selected');
        });

        // Select the clicked card and check its radio button
        cardElement.classList.add('selected');
        const radio = document.getElementById(radioId);
        if (radio) {
            radio.checked = true;
        }
    }

    function goToVehicleDetails(planName) {
        window.location.href = '/vehicle-details?selectedPlan=' + encodeURIComponent(planName);
    }

    // Reading planName from a data-* attribute (rather than an inline onclick
    // string built server-side) avoids breaking on package names that contain
    // an apostrophe, e.g. "Driver's Comprehensive Plan".
    document.querySelectorAll('.select-package-btn').forEach(function (btn) {
        btn.addEventListener('click', function (event) {
            event.stopPropagation();
            goToVehicleDetails(btn.dataset.plan);
        });
    });

    // Initialize selection class on load
    document.addEventListener('DOMContentLoaded', () => {
        const checkedRadio = document.querySelector('.package-card input[type="radio"]:checked');
        if (checkedRadio) {
            checkedRadio.closest('.package-card').classList.add('selected');
        }
    });
</script>
</body>
</html>
