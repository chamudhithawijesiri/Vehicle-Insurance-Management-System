<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Ticket - Auto Shield</title>
    <link rel="stylesheet" th:href="@{/css/fontawesome.min.css}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        :root {
            --bg-color: #0b0f19; --card-bg: rgba(17, 24, 39, 0.7); --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6; --text-secondary: #9ca3af; --primary-color: #00f2fe; --secondary-color: #4facfe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --error-color: #ef4444; --success-color: #10b981; --warning-color: #f59e0b;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit', sans-serif; }
        body { background-color: var(--bg-color); background-image: radial-gradient(circle at top, rgba(11,15,25,0.8) 0%, #0b0f19 100%); background-attachment: fixed; background-size: cover; color: var(--text-primary); min-height: 100vh; }
        header { display:flex; justify-content:center; padding:1.2rem 2rem; border-bottom:1px solid var(--card-border); background: rgba(11,15,25,0.6); backdrop-filter: blur(12px); position: sticky; top:0; z-index:10; }
        .nav-container { display:flex; justify-content:space-between; align-items:center; width:100%; max-width:1200px; }
        .logo { font-size:1.4rem; font-weight:800; color:var(--text-primary); text-decoration:none; }
        .logo span { color: var(--primary-color); }
        .btn { border:none; border-radius:10px; padding:0.55rem 1.1rem; font-weight:600; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:0.4rem; font-size:0.85rem; }
        .btn-primary { background: var(--accent-gradient); color:#06202a; }
        .btn-secondary { background: rgba(255,255,255,0.06); color:var(--text-primary); border:1px solid var(--card-border); }
        .btn-danger { background: rgba(239,68,68,0.12); color: var(--error-color); border:1px solid rgba(239,68,68,0.3); }
        main { max-width: 850px; margin:0 auto; padding: 2.5rem 1.5rem; }
        .details-card { background: var(--card-bg); border:1px solid var(--card-border); border-radius:20px; padding:2rem; margin-bottom:1.5rem; }
        .badge { padding:0.3rem 0.8rem; border-radius:999px; font-size:0.78rem; font-weight:700; }
        .badge-new, .badge-assigned { background: rgba(79,172,254,0.12); color:var(--secondary-color); }
        .badge-in_progress { background: rgba(0,242,254,0.12); color:var(--primary-color); }
        .badge-waiting_for_customer { background: rgba(245,158,11,0.12); color:var(--warning-color); }
        .badge-resolved { background: rgba(16,185,129,0.12); color:var(--success-color); }
        .badge-closed { background: rgba(156,163,175,0.15); color:var(--text-secondary); }
        .thread-msg { border-radius:14px; padding:1rem 1.2rem; margin-bottom:1rem; max-width:85%; }
        .msg-customer { background: rgba(255,255,255,0.04); border:1px solid var(--card-border); }
        .msg-staff { background: rgba(0,242,254,0.06); border:1px solid rgba(0,242,254,0.15); margin-left:auto; }
        .msg-meta { font-size:0.75rem; color:var(--text-secondary); margin-bottom:0.4rem; }
        .control-row { display:flex; gap:0.8rem; flex-wrap:wrap; align-items:center; margin-bottom:1rem; }
        select, textarea, input[type=text] { background: rgba(255,255,255,0.04); border:1px solid var(--card-border); border-radius:10px; padding:0.6rem 0.9rem; color:var(--text-primary); font-family:inherit; }
        textarea { width:100%; resize:vertical; }
        form.inline { display:inline-flex; gap:0.5rem; align-items:center; }
        .checkbox-label { display:flex; align-items:center; gap:0.4rem; font-size:0.85rem; color:var(--text-secondary); }
    </style>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<header>
    <div class="nav-container">
        <a href="/" class="logo"><i class="fa-solid fa-shield-halved"></i> Auto<span>Shield</span></a>
        <a th:href="@{/admin/support}" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back to Queue</a>
    </div>
</header>

<main>
    <div class="details-card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:1rem;">
            <div>
                <div style="color:var(--secondary-color); font-weight:700; font-size:0.85rem;" th:text="${ticket.ticketNumber}">TKT-1234567-AS</div>
                <h1 style="font-size:1.5rem; margin-top:0.3rem;" th:text="${ticket.subject}">Subject</h1>
                <p style="color:var(--text-secondary); margin-top:0.3rem;">
                    <span th:text="${ticket.customer.fullName}">Customer</span> &middot;
                    <span th:text="${ticket.customer.email}">email</span>
                </p>
            </div>
            <span class="badge" th:classappend="${'badge-' + #strings.toLowerCase(ticket.status)}" th:text="${#strings.replace(ticket.status,'_',' ')}">NEW</span>
        </div>
        <hr style="border-color: var(--card-border); margin:1.2rem 0;">
        <p th:text="${ticket.description}">Description</p>
        <p th:if="${ticket.referenceInfo}" style="margin-top:0.8rem; color:var(--text-secondary); font-size:0.9rem;">
            <i class="fa-solid fa-link"></i> Reference: <span th:text="${ticket.referenceInfo}"></span>
        </p>

        <div class="control-row" style="margin-top:1.5rem;">
            <form th:action="@{'/admin/support/' + ${ticket.id} + '/assign'}" method="POST" class="inline">
                <button type="submit" class="btn btn-secondary"><i class="fa-solid fa-user-check"></i> Assign to me</button>
            </form>

            <form th:action="@{'/admin/support/' + ${ticket.id} + '/status'}" method="POST" class="inline">
                <select name="status">
                    <option th:each="s : ${T(com.autoshield.enums.TicketStatus).values()}" th:value="${s}" th:text="${s}" th:selected="${s.name() == ticket.status.name()}"></option>
                </select>
                <button type="submit" class="btn btn-secondary">Update Status</button>
            </form>

            <form th:action="@{'/admin/support/' + ${ticket.id} + '/priority'}" method="POST" class="inline">
                <select name="priority">
                    <option th:each="p : ${T(com.autoshield.enums.TicketPriority).values()}" th:value="${p}" th:text="${p}" th:selected="${p.name() == ticket.priority.name()}"></option>
                </select>
                <button type="submit" class="btn btn-secondary">Set Priority</button>
            </form>

            <form th:action="@{'/admin/support/' + ${ticket.id} + '/escalate'}" method="POST" class="inline">
                <button type="submit" class="btn btn-danger"><i class="fa-solid fa-triangle-exclamation"></i> Escalate</button>
            </form>
        </div>
    </div>

    <div class="details-card">
        <h2 style="font-size:1.1rem; margin-bottom:1rem;">Conversation</h2>
        <div th:each="r : ${ticket.responses}" class="thread-msg" th:classappend="${r.fromStaff} ? 'msg-staff' : 'msg-customer'">
            <div class="msg-meta">
                <span th:text="${r.fromStaff} ? 'Officer' : ticket.customer.fullName"></span> &middot;
                <span th:text="${#temporals.format(r.createdAt, 'dd MMM yyyy, hh:mm a')}"></span>
                <span th:if="${r.infoRequested}" style="color:var(--warning-color);"> &middot; requested more info</span>
            </div>
            <div th:text="${r.message}"></div>
        </div>
        <p th:if="${#lists.isEmpty(ticket.responses)}" style="color:var(--text-secondary);">No replies yet.</p>

        <form th:action="@{'/admin/support/' + ${ticket.id} + '/respond'}" method="POST" style="margin-top:1.5rem;">
            <textarea name="message" rows="3" placeholder="Write a response to the customer..." required></textarea>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.8rem;">
                <label class="checkbox-label">
                    <input type="checkbox" name="requestInfo" value="true"> Mark as "requesting more information"
                </label>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Send Response</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
