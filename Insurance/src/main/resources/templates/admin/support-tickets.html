<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Tickets - Admin - Auto Shield</title>
    <link rel="stylesheet" th:href="@{/css/fontawesome.min.css}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        :root {
            --bg-color: #0b0f19; --card-bg: rgba(17, 24, 39, 0.7); --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6; --text-secondary: #9ca3af; --primary-color: #00f2fe; --secondary-color: #4facfe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --error-color: #ef4444; --success-color: #10b981; --warning-color: #f59e0b;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit', sans-serif; }
        body { background-color: var(--bg-color); background-image: radial-gradient(circle at top, rgba(11,15,25,0.8) 0%, #0b0f19 100%); background-attachment: fixed; background-size: cover; color: var(--text-primary); min-height: 100vh; }
        header { display:flex; justify-content:center; padding:1.2rem 2rem; border-bottom:1px solid var(--card-border); background: rgba(11,15,25,0.6); backdrop-filter: blur(12px); position: sticky; top:0; z-index:10; }
        .nav-container { display:flex; justify-content:space-between; align-items:center; width:100%; max-width:1300px; }
        .logo { font-size:1.4rem; font-weight:800; color:var(--text-primary); text-decoration:none; }
        .logo span { color: var(--primary-color); }
        .btn { border:none; border-radius:10px; padding:0.5rem 1rem; font-weight:600; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:0.4rem; font-size:0.85rem; }
        .btn-secondary { background: rgba(255,255,255,0.06); color:var(--text-primary); border:1px solid var(--card-border); }
        main { max-width: 1300px; margin:0 auto; padding: 2.5rem 1.5rem; }
        table { width:100%; border-collapse: collapse; background: var(--card-bg); border:1px solid var(--card-border); border-radius:16px; overflow:hidden; }
        th, td { padding: 0.9rem 1.1rem; text-align:left; font-size:0.9rem; border-bottom:1px solid var(--card-border); }
        th { color: var(--text-secondary); text-transform:uppercase; font-size:0.72rem; letter-spacing:0.05em; }
        tr:last-child td { border-bottom:none; }
        tr:hover { background: rgba(255,255,255,0.02); }
        a.row-link { color:inherit; text-decoration:none; font-weight:600; }
        .badge { padding:0.25rem 0.7rem; border-radius:999px; font-size:0.72rem; font-weight:700; }
        .badge-new, .badge-assigned { background: rgba(79,172,254,0.12); color:var(--secondary-color); }
        .badge-in_progress { background: rgba(0,242,254,0.12); color:var(--primary-color); }
        .badge-waiting_for_customer { background: rgba(245,158,11,0.12); color:var(--warning-color); }
        .badge-resolved { background: rgba(16,185,129,0.12); color:var(--success-color); }
        .badge-closed { background: rgba(156,163,175,0.15); color:var(--text-secondary); }
        .prio-critical { color:var(--error-color); font-weight:800; }
        .prio-high { color:var(--warning-color); font-weight:700; }
    </style>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<header>
    <div class="nav-container">
        <a href="/" class="logo"><i class="fa-solid fa-shield-halved"></i> Auto<span>Shield</span></a>
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Admin Dashboard</a>
    </div>
</header>

<main>
    <h1 style="font-size:1.8rem; font-weight:800; margin-bottom:1.5rem;">Customer Support Queue</h1>

    <table>
        <thead>
        <tr><th>Ticket</th><th>Customer</th><th>Category</th><th>Priority</th><th>Status</th><th>Received</th></tr>
        </thead>
        <tbody>
        <tr th:each="t : ${tickets}">
            <td><a class="row-link" th:href="@{'/support/tickets/' + ${t.id}}" th:text="${t.ticketNumber}">TKT-1234567-AS</a><br>
                <span style="color:var(--text-secondary); font-weight:400;" th:text="${t.subject}">Subject</span></td>
            <td th:text="${t.customer.fullName}">Jane Perera</td>
            <td th:text="${t.category}">GENERAL</td>
            <td>
                <span th:classappend="${t.priority.name() == 'CRITICAL' ? 'prio-critical' : (t.priority.name() == 'HIGH' ? 'prio-high' : '')}"
                      th:text="${t.priority}">MEDIUM</span>
            </td>
            <td><span class="badge" th:classappend="${'badge-' + #strings.toLowerCase(t.status)}" th:text="${#strings.replace(t.status,'_',' ')}">NEW</span></td>
            <td th:text="${#temporals.format(t.createdAt, 'dd MMM, hh:mm a')}">01 Jan</td>
        </tr>
        <tr th:if="${#lists.isEmpty(tickets)}"><td colspan="6" style="text-align:center; color:var(--text-secondary); padding:2rem;">No open tickets right now.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
