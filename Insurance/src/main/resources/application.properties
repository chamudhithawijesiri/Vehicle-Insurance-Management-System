spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/auto_shield?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Shehan$1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Server Configuration
server.port=8082

# Raises the default 2MB request-body limit so multiple compressed vehicle
# photos (submitted as base64 in a regular form field, not multipart) don't
# get silently truncated or rejected. Client-side compression (see
# vehicle-details.html) keeps typical requests well under this anyway.
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging (optional but good for tracking)
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Policy decision email notifications. Set these environment variables before
# starting the application; never commit SMTP credentials to source control.
# Gmail SMTP defaults. Set MAIL_USERNAME and MAIL_PASSWORD before starting.
# MAIL_PASSWORD must be a Gmail App Password, not the normal account password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@autoshield.local}}