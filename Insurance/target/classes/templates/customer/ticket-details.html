<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Details - Auto Shield</title>
    <link rel="stylesheet" th:href="@{/css/fontawesome.min.css}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        :root {
            --bg-color: #0b0f19; --card-bg: rgba(17, 24, 39, 0.7); --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6; --text-secondary: #9ca3af; --primary-color: #00f2fe; --secondary-color: #4facfe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --success-color: #10b981; --warning-color: #f59e0b;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit', sans-serif; }
        body { background-color: var(--bg-color); background-image: radial-gradient(circle at top, rgba(11,15,25,0.8) 0%, #0b0f19 100%); background-attachment: fixed; background-size: cover; color: var(--text-primary); min-height: 100vh; }
        header { display:flex; justify-content:center; padding:1.2rem 2rem; border-bottom:1px solid var(--card-border); background: rgba(11,15,25,0.6); backdrop-filter: blur(12px); position: sticky; top:0; z-index:10; }
        .nav-container { display:flex; justify-content:space-between; align-items:center; width:100%; max-width:1200px; }
        .logo { font-size:1.4rem; font-weight:800; color:var(--text-primary); text-decoration:none; }
        .logo span { color: var(--primary-color); }
        .btn { border:none; border-radius:10px; padding:0.6rem 1.2rem; font-weight:600; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:0.5rem; }
        .btn-primary { background: var(--accent-gradient); color:#06202a; }
        .btn-secondary { background: rgba(255,255,255,0.06); color:var(--text-primary); border:1px solid var(--card-border); }
        main { max-width: 800px; margin:0 auto; padding: 3rem 1.5rem; }
        .details-card { background: var(--card-bg); border:1px solid var(--card-border); border-radius:20px; padding:2rem; margin-bottom:1.5rem; }
        .ticket-head { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:1rem; }
        .badge { padding:0.3rem 0.8rem; border-radius:999px; font-size:0.78rem; font-weight:700; }
        .badge-new, .badge-assigned { background: rgba(79,172,254,0.12); color:var(--secondary-color); }
        .badge-in_progress { background: rgba(0,242,254,0.12); color:var(--primary-color); }
        .badge-waiting_for_customer { background: rgba(245,158,11,0.12); color:var(--warning-color); }
        .badge-resolved { background: rgba(16,185,129,0.12); color:var(--success-color); }
        .badge-closed { background: rgba(156,163,175,0.15); color:var(--text-secondary); }
        .thread-msg { border-radius:14px; padding:1rem 1.2rem; margin-bottom:1rem; max-width:85%; }
        .msg-customer { background: rgba(255,255,255,0.04); margin-left:auto; border:1px solid var(--card-border); }
        .msg-staff { background: rgba(0,242,254,0.06); border:1px solid rgba(0,242,254,0.15); }
        .msg-meta { font-size:0.75rem; color:var(--text-secondary); margin-bottom:0.4rem; }
        textarea.input-control { width:100%; background: rgba(255,255,255,0.04); border:1px solid var(--card-border); border-radius:10px; padding:0.85rem 1rem; color:var(--text-primary); resize:vertical; }
    </style>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<header>
    <div class="nav-container">
        <a href="/" class="logo"><i class="fa-solid fa-shield-halved"></i> Auto<span>Shield</span></a>
        <a th:href="@{/support/tickets}" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back to My Tickets</a>
    </div>
</header>

<main>
    <div class="details-card">
        <div class="ticket-head">
            <div>
                <div style="color:var(--secondary-color); font-weight:700; font-size:0.85rem;" th:text="${ticket.ticketNumber}">TKT-1234567-AS</div>
                <h1 style="font-size:1.5rem; margin-top:0.3rem;" th:text="${ticket.subject}">Subject</h1>
                <p style="color:var(--text-secondary); margin-top:0.4rem;" th:text="${ticket.category}">GENERAL</p>
            </div>
            <span class="badge" th:classappend="${'badge-' + #strings.toLowerCase(ticket.status)}" th:text="${#strings.replace(ticket.status,'_',' ')}">NEW</span>
        </div>
        <hr style="border-color: var(--card-border); margin:1.2rem 0;">
        <p th:text="${ticket.description}">Description of the issue.</p>
        <p th:if="${ticket.referenceInfo}" style="margin-top:0.8rem; color:var(--text-secondary); font-size:0.9rem;">
            <i class="fa-solid fa-link"></i> Reference: <span th:text="${ticket.referenceInfo}"></span>
        </p>
    </div>

    <div class="details-card">
        <h2 style="font-size:1.1rem; margin-bottom:1rem;">Conversation</h2>
        <div th:each="r : ${ticket.responses}" class="thread-msg" th:classappend="${r.fromStaff} ? 'msg-staff' : 'msg-customer'">
            <div class="msg-meta">
                <span th:text="${r.fromStaff} ? 'Customer Service Officer' : 'You'"></span> &middot;
                <span th:text="${#temporals.format(r.createdAt, 'dd MMM yyyy, hh:mm a')}"></span>
            </div>
            <div th:text="${r.message}"></div>
        </div>
        <p th:if="${#lists.isEmpty(ticket.responses)}" style="color:var(--text-secondary);">No replies yet. We'll notify you as soon as an officer responds.</p>

        <form th:action="@{'/support/tickets/' + ${ticket.id} + '/reply'}" method="POST" style="margin-top:1.5rem;">
            <textarea name="message" rows="3" class="input-control" placeholder="Write a reply..." required></textarea>
            <button type="submit" class="btn btn-primary" style="margin-top:0.8rem;"><i class="fa-solid fa-paper-plane"></i> Send</button>
        </form>
    </div>
</main>
</body>
</html>
