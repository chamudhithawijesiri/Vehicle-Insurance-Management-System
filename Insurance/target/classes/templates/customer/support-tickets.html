<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Support Tickets - Auto Shield</title>
    <link rel="stylesheet" th:href="@{/css/fontawesome.min.css}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        :root {
            --bg-color: #0b0f19; --card-bg: rgba(17, 24, 39, 0.7); --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6; --text-secondary: #9ca3af; --primary-color: #00f2fe; --secondary-color: #4facfe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --error-color: #ef4444; --success-color: #10b981; --warning-color: #f59e0b;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit', sans-serif; }
        body { background-color: var(--bg-color); background-image: radial-gradient(circle at top, rgba(11,15,25,0.8) 0%, #0b0f19 100%); background-attachment: fixed; background-size: cover; color: var(--text-primary); min-height: 100vh; }
        header { display:flex; justify-content:center; padding:1.2rem 2rem; border-bottom:1px solid var(--card-border); background: rgba(11,15,25,0.6); backdrop-filter: blur(12px); position: sticky; top:0; z-index:10; }
        .nav-container { display:flex; justify-content:space-between; align-items:center; width:100%; max-width:1200px; }
        .logo { font-size:1.4rem; font-weight:800; color:var(--text-primary); text-decoration:none; }
        .logo span { color: var(--primary-color); }
        .nav-links { list-style:none; display:flex; gap:1.5rem; align-items:center; }
        .nav-links a { color:var(--text-secondary); text-decoration:none; font-weight:500; }
        .btn { border:none; border-radius:10px; padding:0.6rem 1.2rem; font-weight:600; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:0.5rem; }
        .btn-primary { background: var(--accent-gradient); color:#06202a; }
        .btn-secondary { background: rgba(255,255,255,0.06); color:var(--text-primary); border:1px solid var(--card-border); }
        main { max-width: 1100px; margin: 0 auto; padding: 3rem 1.5rem; }
        .page-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; flex-wrap:wrap; gap:1rem; }
        h1 span { color: var(--primary-color); }
        .ticket-card { background: var(--card-bg); border:1px solid var(--card-border); border-radius:16px; padding:1.3rem 1.6rem; margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; text-decoration:none; color:inherit; }
        .ticket-card:hover { border-color: var(--primary-color); }
        .ticket-number { font-weight:700; color:var(--secondary-color); font-size:0.85rem; }
        .ticket-subject { font-size:1.05rem; font-weight:600; margin-top:0.2rem; }
        .ticket-meta { color: var(--text-secondary); font-size:0.85rem; margin-top:0.3rem; }
        .badge { padding:0.3rem 0.8rem; border-radius:999px; font-size:0.78rem; font-weight:700; text-transform:capitalize; }
        .badge-new, .badge-assigned { background: rgba(79,172,254,0.12); color:var(--secondary-color); }
        .badge-in_progress { background: rgba(0,242,254,0.12); color:var(--primary-color); }
        .badge-waiting_for_customer { background: rgba(245,158,11,0.12); color:var(--warning-color); }
        .badge-resolved { background: rgba(16,185,129,0.12); color:var(--success-color); }
        .badge-closed { background: rgba(156,163,175,0.15); color:var(--text-secondary); }
        .empty-state { text-align:center; color:var(--text-secondary); padding:4rem 1rem; }
    </style>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<header>
    <div class="nav-container">
        <a href="/" class="logo"><i class="fa-solid fa-shield-halved"></i> Auto<span>Shield</span></a>
        <ul class="nav-links">
            <li><a href="/dashboard">Dashboard</a></li>
            <li>
                <form id="logoutForm" th:action="@{/logout}" method="POST" style="display:none;"></form>
                <a href="javascript:void(0);" onclick="document.getElementById('logoutForm').submit();" class="btn btn-secondary">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>
            </li>
        </ul>
    </div>
</header>

<main>
    <div class="page-head">
        <h1 style="font-size:2rem; font-weight:800;">My Support <span>Tickets</span></h1>
        <a th:href="@{/support/new}" class="btn btn-primary"><i class="fa-solid fa-plus"></i> New Request</a>
    </div>

    <div th:if="${tickets == null or #lists.isEmpty(tickets)}" class="empty-state">
        <i class="fa-solid fa-headset" style="font-size:2.5rem; margin-bottom:1rem; display:block;"></i>
        You haven't submitted any support requests yet.
    </div>

    <a th:each="t : ${tickets}" th:href="@{'/support/tickets/' + ${t.id}}" class="ticket-card">
        <div>
            <div class="ticket-number" th:text="${t.ticketNumber}">TKT-1234567-AS</div>
            <div class="ticket-subject" th:text="${t.subject}">Payment not reflected</div>
            <div class="ticket-meta">
                <span th:text="${t.category}">GENERAL</span> &middot;
                <span th:text="${#temporals.format(t.createdAt, 'dd MMM yyyy, hh:mm a')}">01 Jan 2026</span>
            </div>
        </div>
        <span class="badge" th:classappend="${'badge-' + #strings.toLowerCase(t.status)}" th:text="${#strings.replace(t.status,'_',' ')}">NEW</span>
    </a>
</main>
</body>
</html>
